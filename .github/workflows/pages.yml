name: Validate and deploy portfolio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://3dengelen.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/3DEngelen-portfolio/' }}
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
